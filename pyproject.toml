[project]
name = "subagent-allowlist"
version = "0.1.0"
description = "Locking down Claude Code subagents with a tool allowlist"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subagent_allowlist"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
